name: "STRIDE"
version: "1.0"
description: "xAI and Data Analysis Tools for Drift Detection, Characterization, and Explanation"
entrypoint: "../AGENTS.md"
layers:
  rules:
    - path: "./rules/python_package_standards.md"
      description: "Python package architecture, src/stride layout, typing, exception hierarchy, and API conventions."
      trigger_paths:
        - "src/stride/**"
        - "src/**"
        - "pyproject.toml"
    - path: "./rules/dashboard_standards.md"
      description: "Streamlit UI standards, session state isolation, and responsive layout rules."
      trigger_paths:
        - "dashboard/**"
        - "streamlit_app.py"
    - path: "./rules/ml_and_drift_standards.md"
      description: "Machine learning, drift generation, and xAI explainer standards."
      trigger_paths:
        - "src/stride/**"
        - "src/**"
    - path: "./rules/ci_standards.md"
      description: "Local CI validation equivalents and failure resolution protocols."
      trigger_paths:
        - ".github/workflows/**"
        - "requirements.txt"
        - "pyproject.toml"
        - "tests/**"
    - path: "./rules/git_and_pr_standards.md"
      description: "Git branching invariants, Conventional Commits, atomic checklist, and PR creation rules."
      trigger_paths:
        - ".git/**"
        - ".github/**"
    - path: "./rules/release_standards.md"
      description: "Semantic versioning, changelog maintenance, pre-release checklist, and PyPI publication standards."
      trigger_paths:
        - "CHANGELOG.md"
        - ".github/workflows/release.yml"
        - "pyproject.toml"
        - "src/stride/__init__.py"
    - path: "./rules/agent_maintenance_standards.md"
      description: "Autonomous self-maintenance triggers and procedure."
      trigger_paths:
        - ".agents/**"
        - "AGENTS.md"
    - path: "./rules/documentation_standards.md"
      description: "Google-style docstring standards, LaTeX formulations, and API reference synchronization."
      trigger_paths:
        - "src/stride/**"
        - "docs/**"
        - "pyproject.toml"
  context:
    - path: "./context/architecture.md"
      description: "Detailed architecture of src/ modules, data flow, and dashboard layout."
      trigger_paths:
        - "src/**"
        - "dashboard/**"
  skills:
    - path: "./skills/developing-with-streamlit/SKILL.md"
      description: "Official Streamlit skill for dashboard creation, styling, and performance."
      trigger_paths:
        - "dashboard/**"
    - path: "./skills/agent-maintenance/SKILL.md"
      description: "Autonomous .agents/ context maintenance workflow."
      trigger_paths:
        - ".agents/**"
    - path: "./skills/git-pr-workflow/SKILL.md"
      description: "End-to-end Git and Pull Request development workflow with Conventional Commits, local CI verification, and temporary body files."
      trigger_paths:
        - ".git/**"
        - ".github/**"
    - path: "./skills/release-management/SKILL.md"
      description: "Autonomous release management workflow for SemVer version bumps, changelog curation, packaging build checks, and GitHub release creation."
      trigger_paths:
        - "CHANGELOG.md"
        - ".github/workflows/release.yml"
        - "src/stride/__init__.py"
metadata:
  primary_agent: "Antigravity"
  objective: "Provide explainable artificial intelligence (xAI) tools for concept drift detection and an interactive Streamlit dashboard."
