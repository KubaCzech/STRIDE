[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-detection-xai"
version = "0.1.0"
description = "Drift Detection with Explainable AI"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Deniz Aksoy"},
    {name = "Kuba Czech"},
    {name = "Wojciech Nagórka"},
    {name = "Michał Redmer"}
]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "pyclustering",
    "river",
    "matplotlib",
    "umap-learn",
    "lime",
    "shap",
    "streamlit",
    "tensorflow",
    "seaborn",
    "hdbscan",
    "icecream",
    "plotly"
]

[project.optional-dependencies]
dev = [
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 127
exclude = [
    ".venv",
    "sdbm",
    "notebooks",
    ".agents"
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length handled flexibly / up to 127 chars
    "E402",  # module level import not at top of file
    "E741",  # ambiguous variable name (e.g. l)
    "F401",  # imported but unused (common in package init files)
    "F841",  # local variable assigned but never used
]
