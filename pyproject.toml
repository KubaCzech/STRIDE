[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "stride-xai"
version = "0.1.0"
description = "STRIDE: Explainable AI and Drift Detection Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Deniz Aksoy" },
    { name = "Kuba Czech" },
    { name = "Wojciech Nagórka" },
    { name = "Michał Redmer" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy<2.0",
    "pandas",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
vis = [
    "matplotlib",
    "seaborn",
    "plotly",
]
drift = [
    "river",
]
clustering = [
    "pyclustering",
    "hdbscan",
    "umap-learn",
]
xai = [
    "shap",
    "lime",
]
deeplearning = [
    "tensorflow>=2.15.0",
]
dashboard = [
    "streamlit",
    "matplotlib",
    "seaborn",
    "plotly",
    "river",
    "pyclustering",
    "hdbscan",
    "umap-learn",
    "shap",
    "lime",
    "tensorflow>=2.15.0",
    "icecream",
]
dev = [
    "ruff",
    "pytest",
]
all = [
    "matplotlib",
    "seaborn",
    "plotly",
    "river",
    "pyclustering",
    "hdbscan",
    "umap-learn",
    "shap",
    "lime",
    "tensorflow>=2.15.0",
    "streamlit",
    "icecream",
    "ruff",
]

[tool.flit.module]
name = "stride"

[tool.ruff]
target-version = "py310"
line-length = 127
exclude = [
    ".venv",
    "sdbm",
    "notebooks",
    ".agents"
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length handled flexibly / up to 127 chars
    "E402",  # module level import not at top of file
    "E741",  # ambiguous variable name (e.g. l)
    "F401",  # imported but unused (common in package init files)
    "F841",  # local variable assigned but never used
]
